<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Curved text paths for circular typography -->
    <!-- Top arc path for "PONDOK PESANTREN" -->
    <path id="topArc" d="M 85 250 A 165 165 0 1 1 415 250" fill="none" />
    <!-- Bottom arc path for "QOTRUN NADA" -->
    <path id="bottomArc" d="M 95 250 A 155 155 0 0 0 405 250" fill="none" />
    
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Outer White Lotus Frame Outline -->
  <g stroke="#009944" stroke-width="4" fill="#ffffff" stroke-linejoin="round">
    <!-- 9 Petals Frame Background -->
    <path d="
      M 250,15 
      C 275,55 315,60 340,40 
      C 355,80 395,95 425,85 
      C 420,130 455,160 485,165 
      C 460,205 480,245 498,265 
      C 455,290 460,335 480,360 
      C 435,375 425,420 435,450 
      C 390,445 365,480 360,500
      C 320,480 280,495 250,490
      C 220,495 180,480 140,500
      C 135,480 110,445 65,450
      C 75,420 65,375 20,360
      C 40,335 45,290 2,265
      C 20,245 40,205 15,165
      C 45,160 80,130 75,85
      C 105,95 145,80 160,40
      C 185,60 225,55 250,15 Z" 
      fill="#ffffff" stroke="#009944" stroke-width="4" />
  </g>

  <!-- 2. Green Inner Petal Segments -->
  <g fill="#009944" stroke="#006622" stroke-width="3" stroke-linejoin="round">
    <!-- Top Left Green Leaf -->
    <path d="M 160,40 C 135,80 100,95 75,85 C 95,130 85,150 115,170 C 145,130 170,90 160,40 Z" />
    <!-- Top Right Green Leaf -->
    <path d="M 340,40 C 365,80 400,95 425,85 C 405,130 415,150 385,170 C 355,130 330,90 340,40 Z" />
    <!-- Mid Right Green Leaf -->
    <path d="M 485,165 C 455,200 460,230 498,265 C 455,275 440,300 435,335 C 455,280 470,220 485,165 Z" />
    <!-- Bottom Right Green Leaf -->
    <path d="M 435,450 C 395,440 375,465 360,500 C 335,465 310,460 295,470 C 350,470 395,470 435,450 Z" />
    <!-- Bottom Center Green Leaf -->
    <path d="M 250,490 C 230,455 270,455 250,490 Z" />
    <!-- Bottom Left Green Leaf -->
    <path d="M 65,450 C 105,440 125,465 140,500 C 165,465 190,460 205,470 C 150,470 105,470 65,450 Z" />
    <!-- Mid Left Green Leaf -->
    <path d="M 15,165 C 45,200 40,230 2,265 C 45,275 60,300 65,335 C 45,280 30,220 15,165 Z" />
    <!-- Lower Left Leaf -->
    <path d="M 20,360 C 50,350 65,370 70,410 C 45,395 30,380 20,360 Z" />
    <!-- Lower Right Leaf -->
    <path d="M 480,360 C 450,350 435,370 430,410 C 455,395 470,380 480,360 Z" />
    <!-- Bottom Peak Leaf -->
    <path d="M 250,500 C 230,465 220,440 250,420 C 280,440 270,465 250,500 Z" />
  </g>

  <!-- 3. Outer White Circular Ring -->
  <circle cx="250" cy="250" r="182" fill="#ffffff" stroke="#111111" stroke-width="7" />

  <!-- 4. Inner Golden Yellow Circle -->
  <circle cx="250" cy="250" r="126" fill="#ffea00" stroke="#111111" stroke-width="5" />

  <!-- 5. Circular Text: "PONDOK PESANTREN" -->
  <text font-family="'Arial Black', 'Trebuchet MS', 'Impact', sans-serif" font-weight="900" font-size="33" fill="#111111" letter-spacing="3.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      PONDOK PESANTREN
    </textPath>
  </text>

  <!-- 6. Left & Right Golden Stars -->
  <!-- Left Star -->
  <g transform="translate(98, 290) rotate(-10)">
    <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#ffcc00" stroke="#111111" stroke-width="1.5" />
  </g>
  <!-- Right Star -->
  <g transform="translate(402, 290) rotate(10)">
    <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#ffcc00" stroke="#111111" stroke-width="1.5" />
  </g>

  <!-- 7. Circular Text: "QOTRUN NADA" -->
  <text font-family="'Arial Black', 'Trebuchet MS', 'Impact', sans-serif" font-weight="900" font-size="36" fill="#111111" letter-spacing="4.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      QOTRUN NADA
    </textPath>
  </text>

  <!-- 8. Red Minaret / Islamic Dome Emblem in the Center -->
  <g id="center-minaret" stroke="#111111" stroke-width="3.5" stroke-linejoin="round">
    <!-- Red Minaret Base & Body -->
    <path d="
      M 250,140 
      C 272,158 280,185 280,215 
      L 308,230 
      L 285,280 
      L 270,280 
      L 255,205 
      L 250,180 
      L 245,205 
      L 230,280 
      L 215,280 
      L 192,230 
      L 220,215 
      C 220,185 228,158 250,140 Z" 
      fill="#d62226" />

    <!-- Yellow / Gold Center Spire -->
    <polygon points="250,140 258,210 250,280 242,210" fill="#ffea00" />
    
    <!-- Top Crescent Moon & Star inside Red Dome -->
    <!-- Black Circle Background for Crescent -->
    <circle cx="250" cy="180" r="19" fill="#111111" stroke="none" />
    <!-- Red Crescent Moon cutout -->
    <path d="
      M 253,165 
      A 15 15 0 0 0 253,195 
      A 12 12 0 0 1 253,165 Z" 
      fill="#d62226" stroke="none" />
    <!-- 5-Pointed Star inside Moon -->
    <polygon points="257,175 259,179 263,179 260,182 261,186 257,183 253,186 254,182 251,179 255,179" fill="#d62226" stroke="none" />
  </g>

  <!-- 9. Open Holy Quran / Kitab Suci at the Bottom Center -->
  <g id="open-quran" stroke="#111111" stroke-width="3.5" stroke-linejoin="round">
    <!-- Book Pages Background (White) -->
    <path d="
      M 250,295 
      C 230,278 195,278 175,285 
      L 170,345 
      C 195,338 230,338 250,350 
      C 270,338 305,338 330,345 
      L 325,285 
      C 305,278 270,278 250,295 Z" 
      fill="#ffffff" />
    
    <!-- Book Spine Divider -->
    <line x1="250" y1="295" x2="250" y2="350" stroke="#111111" stroke-width="4" />

    <!-- Left Page Text Lines -->
    <line x1="185" y1="296" x2="240" y2="293" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="184" y1="306" x2="240" y2="303" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="183" y1="316" x2="240" y2="313" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="182" y1="326" x2="240" y2="323" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="181" y1="336" x2="240" y2="333" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Page Text Lines -->
    <line x1="260" y1="293" x2="315" y2="296" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="260" y1="303" x2="316" y2="306" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="260" y1="313" x2="317" y2="316" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="260" y1="323" x2="318" y2="326" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="260" y1="333" x2="319" y2="336" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
